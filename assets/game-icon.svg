<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Grid outline -->
  <rect x="76" y="76" width="360" height="360" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Row 1 -->
  <rect x="96" y="96" width="76" height="76" rx="14" fill="#FF6B6B" filter="url(#glow)"/>
  <rect x="184" y="96" width="76" height="76" rx="14" fill="#4ECDC4"/>
  <rect x="272" y="96" width="76" height="76" rx="14" fill="#FFE66D"/>
  <rect x="360" y="96" width="76" height="76" rx="14" fill="#A8E6CF"/>
  <!-- Row 2 -->
  <rect x="96" y="184" width="76" height="76" rx="14" fill="#6C5CE7"/>
  <rect x="184" y="184" width="76" height="76" rx="14" fill="#FF6B6B"/>
  <rect x="272" y="184" width="76" height="76" rx="14" fill="#4ECDC4"/>
  <rect x="360" y="184" width="76" height="76" rx="14" fill="#FFE66D"/>
  <!-- Row 3 -->
  <rect x="96" y="272" width="76" height="76" rx="14" fill="#FFE66D" filter="url(#glow)"/>
  <rect x="184" y="272" width="76" height="76" rx="14" fill="#A8E6CF"/>
  <rect x="272" y="272" width="76" height="76" rx="14" fill="#6C5CE7"/>
  <rect x="360" y="272" width="76" height="76" rx="14" fill="#FF6B6B"/>
  <!-- Row 4 -->
  <rect x="96" y="360" width="76" height="76" rx="14" fill="#4ECDC4"/>
  <rect x="184" y="360" width="76" height="76" rx="14" fill="#FFE66D" filter="url(#glow)"/>
  <rect x="272" y="360" width="76" height="76" rx="14" fill="#FF6B6B"/>
  <rect x="360" y="360" width="76" height="76" rx="14" fill="#6C5CE7" filter="url(#glow)"/>
  <!-- Shine overlay -->
  <rect width="512" height="256" rx="108" fill="url(#shine)" opacity="0.07"/>
  <defs>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white"/>
      <stop offset="100%" style="stop-color:white;stop-opacity:0"/>
    </linearGradient>
  </defs>
</svg>